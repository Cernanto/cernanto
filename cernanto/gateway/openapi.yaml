        - exists
    PackageStored:
      type: object
      properties:
        stored:
          type: string
          description: The digest, as given.
      required:
        - stored
    CompileRequest:
      description: "One compile inside the plane's compiler: the uploaded workspace files (agents-root relative, base64), the targets, the switches. The plane owns everything else: sessions, judgments, gates, packages, the ship."
      type: object
      properties:
        protocol:
          type: number
          description: The wire protocol major, 0.
        op:
          type: string
          const: compile.run
        compileId:
          type: string
        targets:
          type: array
          items:
            type: string
        files:
          type: object
          additionalProperties:
            type: string
          description: Agents-root-relative path to base64 content.
        coder:
          type: string
          enum:
            - claude-code
            - codex
        runtimeHarness:
          type: string
          enum:
            - claude-code
            - codex
            - openai
        verify:
          type: boolean
          description: "Run the live tester on the plane after the compile; it means something on a deploy, since a verified package needs a live run and a compile alone never verifies."
        newContract:
          type: boolean
          description: "Skip the compatibility judgment and the anchor: the session writes a new contract from the specification, and the dependents whose pinned contract breaks recompile in the same run."
        cascade:
          type: boolean
        recompile:
          type: boolean
          description: Ignore the compile cache for every agent of this compile.
        planOnly:
          type: boolean
          description: "Stop after the change step of every target and answer the plans: nothing is written, verified or shipped."
        maxLiveCycles:
          type: number
          description: Fix rounds a failing test run may take; zero fails fast.
        contracts:
          type: object
          additionalProperties:
            type: string
          description: "A given contract per agent id, as declaration text: preserved as it is, no judgment asked, a session that drifts from it fails."
        seeds:
          type: object
          additionalProperties:
            type: object
            properties:
              files:
                type: object
                additionalProperties:
                  type: string
              coder:
                type: object
                properties:
                  name:
                    type: string
                  cli:
                    type: string
                  model:
                    type: string
                  effort:
                    type: string
                required:
                  - name
            required:
              - files
          description: "Reviewed coder sources per target agent (workspace `src/` relative path to base64 content), written as if a session wrote them: no session opens for a seeded agent, its tests are off and the cache is skipped, and a gate failure fails it with the gate's words. `coder` names the vendor that wrote the source, carried into the artifact's provenance. Every seeded agent's artifact is packed into the plane store and named in its report, modules included, its layer linking the platform libraries at the release's shared location; a seeded agent is never answered as a fleet row."
        packages:
          type: object
          additionalProperties:
            type: string
          description: "The workspace's own package per agent id: the sha256 digest of the .cern file beside its spec, already in the plane store."
      required:
        - protocol
        - op
        - compileId
        - targets
        - files
    PlaneCompileResponse:
      description: "What a plane compile answers: the report, the shippable rows (modules ride inside their consumers and never appear), and the workspace write-backs (path to base64) the client writes beside its specs."
      type: object
      properties:
