          required:
            - callId
        record:
          $ref: "#/components/schemas/TraceRecord"
        lines:
          type: array
          items:
            type: string
        result:
          description: What the function answered, as it is.
        error:
          $ref: "#/components/schemas/ErrorEnvelope"
    LandRequest:
      description: "Packages to land into the fleet as their own rows, with the packages they need: ones the plane already holds, by their digests, or ones the registry serves, by their references; one target, or a list landed as one landing (one closure, one admission, one ship, so every carrier rolls once)."
      type: object
      properties:
        target:
          type: string
          description: "A sha256 digest of a package the plane holds, or a registry reference: an agent id alone or with @ and a version or range (acme/greeter, acme/greeter@^1.2.0). One target, or the list."
        targets:
          type: array
          items:
            type: string
          description: "Several targets, each a digest or a registry reference, landed as one landing. One target, or the list."
        noDeps:
          type: boolean
          description: Land what was given even when a dependency cannot be resolved from the registry.
        installed:
          type: boolean
          description: "The packages are a third party's, from their files or the registry: their rows carry the package mark, and the author's own agents refuse them. Absent, the packages are the author's own from the author's tree; a package a reference names is a third party's whatever it says."
