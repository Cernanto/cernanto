        - durationMs
        - status
    CallStreamEvent:
      description: "One event of a call's stream: a call entered (`call`, with its `depth` in the walk, the root 0), a record of the call last entered (`record`, with its `lines` under a view), lines of the conversation that belong to no one record (`lines` alone: the frame and the closing), or the error that ended the stream (`error`)."
