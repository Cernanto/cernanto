        depth:
          type: integer
          minimum: 0
        record:
          $ref: "#/components/schemas/TraceRecord"
        lines:
          type: array
          items:
            type: string
        error:
          type: string
    SleepRecord:
      type: object
      properties:
        kind:
          type: string
          const: sleep
        durationMs:
          type: number
        agentId:
          type: string
        callId:
          type: string
        attemptId:
          type: string
          description: The attempt of the call the record belongs to, when the record is the attempt's own.
        run:
          type: string
          description: "The run that made the record, `<grant>.<count>`: runs order by their grant, then their count, as numbers."
        place:
          type: number
          description: "The record's place in its run: inside one run the records order by it."
        seq:
          type: number
        at:
          type: string
      required:
        - kind
        - durationMs
        - agentId
        - callId
        - seq
        - at
    StepRecord:
      type: object
      properties:
        kind:
          type: string
          const: step
        label:
          type: string
        error:
          type: string
        stack:
          type: string
        durationMs:
          type: number
        agentId:
          type: string
        callId:
          type: string
        attemptId:
          type: string
          description: The attempt of the call the record belongs to, when the record is the attempt's own.
        run:
          type: string
          description: "The run that made the record, `<grant>.<count>`: runs order by their grant, then their count, as numbers."
        place:
          type: number
          description: "The record's place in its run: inside one run the records order by it."
        seq:
          type: number
        at:
          type: string
      required:
        - kind
        - label
        - durationMs
        - agentId
        - callId
        - seq
        - at
    TokenCreateBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required:
        - name
    TokenCreated:
      description: Auth's answer, as auth gave it.
      allOf:
        - $ref: "#/components/schemas/TokenCreateResult"
    TokenCreateResult:
      description: A minted token, answered once in plaintext.
      type: object
      properties:
        name:
          type: string
          description: The token's name.
        token:
          type: string
          description: The token's value; the document keeps only its hash.
        createdAt:
          type: string
          description: When it was minted.
      required:
        - name
        - token
        - createdAt
    TokenRevokeResult:
      description: A revoked token.
      type: object
      properties:
        revoked:
          type: string
          description: The token's name.
        revokedAt:
          type: string
          description: When it was revoked.
      required:
        - revoked
        - revokedAt
    TokensResult:
      description: The plane's tokens.
      type: object
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenSummary"
          description: One row per token, hashes never included.
      required:
        - tokens
    TokenSummary:
      description: One token, as the operator sees it.
      type: object
      properties:
        name:
          type: string
          description: The token's name.
        createdAt:
          type: string
          description: When it was minted.
        lastUsedAt:
          type: string
          description: When it last authenticated.
        revokedAt:
          type: string
          description: When it was revoked.
      required:
        - name
        - createdAt
    LsFunction:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    LsResult:
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/LsRow"
        metrics:
          type: boolean
        sampledAt:
          type: string
        usageSince:
          type: string
        notices:
          type: array
          items:
            type: string
        callsComplete:
          type: boolean
          description: Every unfinished call had caller metadata available at this sample.
      required:
        - agents
        - metrics
        - sampledAt
        - usageSince
        - notices
        - callsComplete
    LsRow:
      type: object
      properties:
        agentId:
          type: string
        type:
          type: string
          enum:
            - task
            - job
            - service
            - worker
            - module
            - interface
        status:
          type: string
        copies:
          type: number
        ready:
          type: string
        restarts:
          type: number
        cpuMillicores:
          type: number
        memoryMi:
          type: number
        journalEntries:
          type: number
        snapshotMi:
          type: number
          description: "The parked image the plane holds of the agent, what a restart loads, in exact mebibytes (the bytes over 1048576), summed over its generation copies; absent when the plane holds none or the holdings could not be read."
        journalMi:
          type: number
          description: "What the plane journaled for the agent since its image, what a restart replays, in exact mebibytes; absent when the holdings could not be read."
        incomingTotal:
          type: number
          description: Observed logical incoming starts since totalsSince, independent of trace retention. Replay is deduplicated.
        outgoingTotal:
          type: number
          description: Observed child call starts since totalsSince. New job attempts can create new child calls.
        incomingActive:
          type: number
          description: "The calls made of the agent that it holds now and has not answered, summed over the copies that answered when the listing asked them. For a module, the calls into it in flight inside the copies it is linked into; for an interface, the sum over its implementors' rows."
        outgoingActive:
          type: number
          description: "The calls the agent's code made and still waits on, summed the same way."
        copiesAsked:
          type: number
          description: "How many running copies the listing asked for the agent's active calls: its own copies; for a module, the copies it is linked into; for an interface, the sum over its implementors' rows."
        copiesAnswered:
          type: number
          description: "How many of them answered in time. Fewer than copiesAsked leaves the two sums partial; none of some leaves them unknown."
        totalsSince:
          type: string
        inputTokens:
          type: number
        outputTokens:
          type: number
        costUsd:
          type: number
          description: Provider-reported USD during the usage window, attributed once to the work owner. Omitted when any turn has no price.
        functions:
          type: array
          items:
            $ref: "#/components/schemas/LsFunction"
      required:
        - agentId
        - type
        - status
        - copies
        - ready
        - restarts
    LiveRecord:
      description: "One record of an agent's live stream with the lines the trace view reads it as (an empty list for a record the view does not show)."
      type: object
      properties:
        record:
          $ref: "#/components/schemas/TraceRecord"
        lines:
          type: array
          items:
            type: string
      required:
        - record
        - lines
    TraceRecord:
      description: One trace record of any kind.
      anyOf:
        - $ref: "#/components/schemas/HandlerRecord"
        - $ref: "#/components/schemas/AgentCallRecord"
        - $ref: "#/components/schemas/StepRecord"
        - $ref: "#/components/schemas/SleepRecord"
        - $ref: "#/components/schemas/BeginRecord"
        - $ref: "#/components/schemas/LogRecord"
