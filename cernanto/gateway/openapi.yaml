openapi: 3.1.0
info:
  title: Cernanto API
  version: 0.2.0
  license:
    name: Apache License, Version 2.0
    identifier: Apache-2.0
  description: "The plane's public API, the one thing outside callers speak to; nothing else of the plane is ever exposed. The operations are the cli's verbs and the oauth landing, named as the cli names them. Answers are JSON unless an operation says otherwise; an error answers `{error: {kind, message}}` with a status by the kind: terminal and contract-violation 400, judgment-inconclusive 422, retryable and target-unavailable 503, an unexpected failure 500. A request no operation matches is answered 404 with exactly `the gateway has no route for <METHOD> <url>`, carrying no kind. Bodies arrive whole; a body over 256 MiB is refused 413."
servers:
  - url: http://127.0.0.1:7434
    description: The plane on this machine.
security:
  - operatorToken: []
tags:
  - name: plane
    description: "The plane: its status, its version, the configuration's coder, the tokens, the release its hosts upgrade to, a host's drain."
  - name: agents
    description: "The deployed agents: the fleet, one agent, its calls, its program."
  - name: calls
    description: "The calls: the list, one call's records and tree, the live stream, the cancel."
  - name: deploy
    description: "The pipeline: the landing of packages, the compile, the packages themselves."
  - name: auth
    description: "The agents' accounts: what is logged in, what is waiting for the operator, the answers and the logouts."
  - name: ingress
    description: "The oauth landing: an open path."
  - name: documents
    description: The API's own description.
  - name: health
    description: The probes and counters for the cluster and the scrapers.
paths:
  /healthz:
    get:
      operationId: healthz
      tags:
        - health
      summary: "Answers {ok: true} when the substrate behind the API answers."
      security: []
      responses:
        "200":
          description: The substrate answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
        "503":
          description: "Exactly `the substrate did not answer within two seconds`, or `the substrate is unhealthy: <its words>` when the ask failed; kind retryable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /metrics:
    get:
      operationId: metrics
      tags:
        - health
      summary: "The API's own counters in the Prometheus text format."
      responses:
        "200":
          description: "A `# TYPE cernanto_gateway_requests_total counter` line, then one `cernanto_gateway_requests_total{method=\"<METHOD>\",status=\"<status>\"} <count>` line per pair."
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/upgrade:
    put:
      operationId: upgrade
      tags:
        - plane
      summary: "Names the release the plane's hosts upgrade to, one host at a time, each draining first; a plane of one machine refuses."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeRequest"
      responses:
        "200":
          description: "The release pointer as written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeResult"
        "400":
          description: "A version that is not a release name, or a plane of one machine: `{error: {kind: \"terminal\", message}}`, the backend's words."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/hosts/{host}/drain:
    post:
      operationId: drainHost
      tags:
        - plane
      summary: "Tells one host to let its copies go for the other hosts to take; a plane of one machine refuses."
      parameters:
        - $ref: "#/components/parameters/host"
      responses:
        "202":
          description: "The host whose drain word is written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainHostResult"
        "400":
          description: "A host no heartbeat names, or a plane of one machine: `{error: {kind: \"terminal\", message}}`, the backend's words."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/ls:
    get:
      operationId: ls
      tags:
        - agents
      summary: "Every agent of the fleet: status, resources, journal, calls in and out, the calls active now, ai usage and cost; focused on one agent, its functions."
      parameters:
        - $ref: "#/components/parameters/agentQ"
      responses:
        "200":
          description: The rows; metrics says whether any row carries sampled figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/agents:
    get:
      operationId: agents
      tags:
        - agents
      summary: "The fleet's rows as shipped, its generations and its conditions."
      responses:
        "200":
          description: The rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/agents/{agentId}:
    get:
      operationId: describe
      tags:
        - agents
      summary: "One agent: its row as shipped and its contract."
      parameters:
        - $ref: "#/components/parameters/agentId"
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescribeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Exactly `no agent \"<agentId>\"`, carrying no kind."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: agentDelete
      tags:
        - agents
      summary: Undeploys one agent and its tester; refused while deployed agents depend on it unless forced.
      parameters:
        - $ref: "#/components/parameters/agentId"
        - $ref: "#/components/parameters/force"
      responses:
        "200":
          description: "What the removal did, verbatim."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeleteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Exactly `no agent \"<agentId>\"`, carrying no kind."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 'Nothing removed: `{error: {kind: "terminal", message: "deployed agents depend on \"<agentId>\": <the dependents, comma joined>"}, dependents}`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDeleteConflict"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/agents/{agentId}/invoke/{function}:
    post:
      operationId: invoke
      tags:
        - agents
      summary: "Calls one exported function of a deployed agent and waits for its answer, for as long as it works."
      description: "The row gate (an id nothing is deployed as: 404; a module is never served, and an interface is served by its default implementor, the gate judging that id, or refused when it has none: 400), then one call under the body's idempotency key, waited for until it answers. A target-unavailable failure (a deploy still converging) repeats the call every 300 milliseconds for up to sixty seconds before answering 503."
      parameters:
        - $ref: "#/components/parameters/agentId"
        - $ref: "#/components/parameters/functionName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "200":
          description: "The function's answer and the call's id."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeResponse"
        "400":
          description: "Exactly `agent \"<agentId>\" is a module; it runs inside <the composing agents, sorted, comma-separated, or \"no agent yet\">: invoke one of them`, or `agent \"<agentId>\" is an interface with no default implementor; it is implemented by <the implementors, sorted, comma-separated, or \"no agent yet\">`; else the callee's own terminal or contract-violation error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Exactly `no agent \"<agentId>\"`, carrying no kind, for an id nothing is deployed as; or exactly `agent \"<agentId>\" has no function \"<function>\"; cernanto contract <agentId> lists its functions`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/Inconclusive"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          description: "After sixty seconds of target-unavailable: `{error: {kind: \"retryable\", message: \"invoke <service>/<function> failed: <its message>\"}}`; else the callee's retryable error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/agents/{agentId}/invoke/{function}/stream:
    post:
      operationId: invokeStream
      tags:
        - agents
      summary: "Calls one exported function of a deployed agent and answers as server-sent events, opened by a `: stream open` comment line with a `: ping` comment every fifteen seconds: the call's id once a copy took it, each record as the copy makes it, then its answer or its failure."
      description: "The row gate of `invoke` first, answered in its statuses before the stream opens; then one call under the body's idempotency key, followed from its acceptance by the copy that took it and joined with what the store holds, so every record of the call is told once, in the order of its runs and their places, and the stream ends with the call's answer."
      parameters:
        - $ref: "#/components/parameters/agentId"
        - $ref: "#/components/parameters/functionName"
        - $ref: "#/components/parameters/streamView"
        - $ref: "#/components/parameters/details"
        - $ref: "#/components/parameters/debug"
        - $ref: "#/components/parameters/zone"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "200":
          description: "The stream; it ends with the call's answer or its failure, or when the client goes."
          content:
            text/event-stream:
              schema:
                type: string
                description: "Each data event is one InvokeStreamEvent as JSON."
        "400":
          description: "As `invoke` answers it: a module, or an interface with no default implementor, named in the same words."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "As `invoke` answers it: exactly `no agent \"<agentId>\"`, or exactly `agent \"<agentId>\" has no function \"<function>\"; cernanto contract <agentId> lists its functions`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/agents/{agentId}/start:
    post:
      operationId: agentStart
      tags:
        - agents
      summary: "Starts an agent's program again: a new version of the same code runs it from the top."
      parameters:
        - $ref: "#/components/parameters/agentId"
      responses:
        "202":
          description: The start is on the list; the plane births the version that runs it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStartResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/agents/{agentId}/calls/stream:
    get:
      operationId: callsStream
      tags:
        - calls
      summary: "Holds the socket open as server-sent events, opened by a `: stream open` comment line: one `data: <record as JSON>` event per new record of the agent's calls (under `view=live`, the record with its lines as a LiveRecord), a `: ping` comment every fifteen seconds."
      parameters:
        - $ref: "#/components/parameters/agentId"
        - $ref: "#/components/parameters/backlog"
        - $ref: "#/components/parameters/since"
        - $ref: "#/components/parameters/streamView"
        - $ref: "#/components/parameters/details"
        - $ref: "#/components/parameters/debug"
        - $ref: "#/components/parameters/zone"
      responses:
        "200":
          description: The stream; it ends when the client goes.
          content:
            text/event-stream:
              schema:
                type: string
                description: "Each data event is one TraceRecord as JSON, or, under `view=live`, one LiveRecord: the record and the lines the trace view reads it as."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/history:
    get:
      operationId: history
      tags:
        - agents
      summary: "Which package ran when, newest first: every generation of the fleet, or one agent's."
      parameters:
        - $ref: "#/components/parameters/agentQ"
      responses:
        "200":
          description: "The entries, newest first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calls:
    get:
      operationId: calls
      tags:
        - calls
      summary: "Recent calls, newest first."
      parameters:
        - $ref: "#/components/parameters/agentQ"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: The calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calls/{callId}:
    get:
      operationId: call
      tags:
        - calls
      summary: "One call, a page at a time: what it is, a page of its records from `after`, the calls it caused as calls, and `next` when more records remain; with `view=live` the trace view's reading of the page's records."
      parameters:
        - $ref: "#/components/parameters/callId"
        - $ref: "#/components/parameters/after"
        - $ref: "#/components/parameters/streamView"
        - $ref: "#/components/parameters/details"
        - $ref: "#/components/parameters/debug"
        - $ref: "#/components/parameters/zone"
      responses:
        "200":
          description: The call and one page of its records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Exactly `no call \"<callId>\" is recorded`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calls/{callId}/stream:
    get:
      operationId: callStream
      tags:
        - calls
      summary: "One call whole, however large, as server-sent events that end when the call is told, opened by a `: stream open` comment line with a `: ping` comment every fifteen seconds: its call, then every record in order (with `tree` the calls it caused walked depth first, each entered before its records), and under `view` the trace view's lines with each record."
      parameters:
        - $ref: "#/components/parameters/callId"
        - $ref: "#/components/parameters/tree"
        - $ref: "#/components/parameters/view"
        - $ref: "#/components/parameters/details"
        - $ref: "#/components/parameters/debug"
        - $ref: "#/components/parameters/zone"
      responses:
        "200":
          description: "The stream; it ends when the last record was sent, or when the client goes."
          content:
            text/event-stream:
              schema:
                type: string
                description: "Each data event is one CallStreamEvent as JSON: a call entered, a record (with its lines under a view), lines of the conversation that belong to no record, or the error that ended the stream."
        "400":
          description: "Exactly `a view reads one call: ask without tree`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Exactly `no call \"<callId>\" is recorded`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/calls/{callId}/cancel:
    post:
      operationId: cancel
      tags:
        - calls
      summary: "Ends a call: the process holding it is asked to end it."
      parameters:
        - $ref: "#/components/parameters/callId"
      responses:
        "200":
          description: "Always {ok: true}, whether the call was reached or had ended already."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/compiles/{compileId}/progress:
    get:
      operationId: compileProgress
      tags:
        - deploy
      summary: "A compile's narration and outcome: its steps so far, and its answer or its failure once it ended."
      parameters:
        - $ref: "#/components/parameters/compileId"
        - $ref: "#/components/parameters/take"
        - $ref: "#/components/parameters/call"
      responses:
        "200":
          description: The compile's progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileProgressResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Exactly `no compile \"<compileId>\"`: no progress is held for the compile and the query names no call; asked with the call its start answered, a compile that has not reached its document yet answers `waiting`. A compile that ended without its last word leaves its document at `running`; the call's own end is the word on it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/land:
    post:
      operationId: land
      tags:
        - deploy
      summary: "Lands a package the plane holds into the fleet as its own row, with the packages it needs: the closure resolved through the registry, the admission, the rows shipped."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandRequest"
      responses:
        "200":
          description: "What landed, what the registry supplied, and the warnings."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/compile:
    post:
      operationId: compile
      tags:
        - deploy
      summary: "Compiles the targets the landing found not current: the workspace upload, the given contracts, the switches; the compile runs behind the API as a run of its own, nothing ships."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileRequest"
      responses:
        "202":
          description: "The compile's call is stored on the plane; follow the compile by its progress."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallStarted"
        "400":
          description: "Exactly `a compile needs its compileId`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          description: "Exactly `the compile submit failed: <its message>`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/deploy:
    post:
      operationId: deploy
      tags:
        - deploy
      summary: "The whole road for the targets the landing handed over: the plane compiles, verifies when asked, ships the rows inside itself and the run answers when they converged."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileRequest"
      responses:
        "202":
          description: "The compile's call is stored on the plane; follow the compile by its progress."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallStarted"
        "400":
          description: "Exactly `a compile needs its compileId`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          description: "Exactly `the compile submit failed: <its message>`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/packages/{digest}:
    get:
      operationId: packageGet
      tags:
        - deploy
      summary: "The package whole, its slices joined and sha-verified."
      parameters:
        - $ref: "#/components/parameters/digest"
      responses:
        "200":
          description: The .cern bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Exactly `no package \"<digest>\" on this plane`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: packagePut
      tags:
        - deploy
      summary: Stores a package as 6 MiB slices committed by a manifest written last; an existing digest answers at once.
      parameters:
        - $ref: "#/components/parameters/digest"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageStored"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: A body over 256 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/packages/{digest}/exists:
    get:
      operationId: packageExists
      tags:
        - deploy
      summary: Whether the plane holds a package of this digest.
      parameters:
        - $ref: "#/components/parameters/digest"
      responses:
        "200":
          description: "The answer, never a 404."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageExists"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/accounts:
    get:
      operationId: authList
      tags:
        - auth
      summary: "The agents' accounts and the asks they are parked on, by agent: what the auth list shows; an agent keeps its own alone."
      parameters:
        - $ref: "#/components/parameters/agentQ"
      responses:
        "200":
          description: The accounts and the pending asks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: authLogout
      tags:
        - auth
      summary: "Forgets an agent's account whole: its value, its setup fields and its auth state; the next call that needs it asks again."
      parameters:
        - $ref: "#/components/parameters/agentRequiredQ"
        - $ref: "#/components/parameters/nameRequiredQ"
      responses:
        "200":
          description: The account is forgotten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoggedOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such account, in the safe's words.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/asks/{id}:
    post:
      operationId: authLogin
      tags:
        - auth
      summary: "Answers a pending fields ask: the operator's filled fields become the asking agent's account and every call parked on it resumes."
      parameters:
        - $ref: "#/components/parameters/askId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: The account is logged in; every call parked on it resumes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoggedIn"
        "400":
          description: "Exactly `an authorization or a display completes on the agent's side`, or the ask is answered already, in the safe's words."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such ask, in the safe's words.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /oauth/callback:
    get:
      operationId: oauthCallback
      tags:
        - ingress
      summary: "The oauth landing: hands the provider's code to cernanto/auth for the account that pinned the state. A provider's own extra query parameters are taken as they come, never refused."
      security: []
      x-cernanto-open-query: true
      parameters:
        - $ref: "#/components/parameters/state"
        - $ref: "#/components/parameters/code"
        - $ref: "#/components/parameters/error"
        - $ref: "#/components/parameters/errorDescription"
      responses:
        "200":
          description: "`<h3>Authorized</h3><p>Account \"<account>\" is connecting. Return to the terminal.</p>`"
          content:
            text/html:
              schema:
                type: string
        "404":
          description: "`<h3>Unknown authorization</h3><p>This link was already used or never issued.</p>`"
          content:
            text/html:
              schema:
                type: string
        "503":
          description: "`<h3>Platform not ready</h3><p>Try the authorization link again shortly.</p>`"
          content:
            text/html:
              schema:
                type: string
  /v1/tokens:
    post:
      operationId: tokenCreate
      tags:
        - plane
      summary: Mints a named operator token; the plaintext comes back once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreateBody"
      responses:
        "200":
          description: "The token, answered once in plaintext."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
        "400":
          description: "Auth's refusals, answered 400."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A duplicate name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: tokenList
      tags:
        - plane
      summary: "The plane's tokens, hashes never included."
      responses:
        "200":
          description: "Auth's answer, verbatim."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokensResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tokens/{name}:
    delete:
      operationId: tokenRevoke
      tags:
        - plane
      summary: Revokes a token by name.
      parameters:
        - $ref: "#/components/parameters/tokenName"
      responses:
        "200":
          description: The revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRevokeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: An unknown name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/harness:
    get:
      operationId: harnessView
      tags:
        - plane
      summary: "The plane's AI coder."
      responses:
        "200":
          description: "The coder, or null when none is set."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessViewResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: harnessSet
      tags:
        - plane
      summary: "Makes a vendor the plane's AI coder."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarnessSetBody"
      responses:
        "200":
          description: The stored row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetResult"
        "400":
          description: "A vendor or a mode off the list, refused by the document's validator naming the field before the operation runs."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/config/get:
    post:
      operationId: configGet
      x-cernanto-secret: true
      tags:
        - plane
      summary: "Reads one setting as the operator, or an interface's default by its key; the configuration is secret, so no record keeps the key or the value."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigGetBody"
      responses:
        "200":
          description: The value, null when unset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigGetResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/config/set:
    post:
      operationId: configSet
      x-cernanto-secret: true
      tags:
        - plane
      summary: "Writes one setting, plane-wide, as the operator; null removes it. The configuration is secret, so no record keeps the key or the value."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigSetBody"
      responses:
        "200":
          description: Whether a value now stands at the key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSetResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/config:
    get:
      operationId: configList
      x-cernanto-secret: true
      tags:
        - plane
      summary: "The configuration as the operator: one place's settings and default, or the map of every place; the configuration is secret, so no record keeps the listing."
      parameters:
        - name: place
          in: query
          required: false
          description: "An agent's id: that place's settings and default alone; without one, every place with its mapping."
          schema:
            type: string
      responses:
        "200":
          description: The mapping asked for, empty when nothing stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/openapi.json:
    get:
      operationId: openapiDocument
      tags:
        - documents
      summary: "This document, as the API serves it."
      parameters:
        - name: host
          in: header
          required: false
          description: "The host the request came through, as the client sent it: the served document's servers name it."
          schema:
            type: string
      responses:
        "200":
          description: "The document, its servers rewritten to the request's own scheme and host."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenApiDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Unexpected"
components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: "An operator token, minted by tokenCreate and kept by auth as its sha256: the digest of the bearer names a live token. A request made at the plane's own machine (a loopback peer that names a loopback host, passed on by no front and sent by no other site's page) needs no bearer and is the operator `local`; a bearer equal to the file secrets/operator-token under the working folder is the operator `bootstrap`. Every operation demands it except /healthz and /oauth/callback."
  parameters:
    agentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
      description: "The agent's id, url-encoded (its slashes as %2F)."
    functionName:
      name: function
      in: path
      required: true
      schema:
        type: string
      description: The exported function to call.
    compileId:
      name: compileId
      in: path
      required: true
      schema:
        type: string
      description: "A compile's id, the one its deploy or compile request named."
    callId:
      name: callId
      in: path
      required: true
      schema:
        type: string
      description: "A call's id."
    host:
      name: host
      in: path
      required: true
      schema:
        type: string
      description: "A host's name, as the plane's nodes list it."
    digest:
      name: digest
      in: path
      required: true
      schema:
        type: string
      description: "The package digest, `sha256:` and hex."
    tokenName:
      name: name
      in: path
      required: true
      schema:
        type: string
    force:
      name: force
      in: query
      schema:
        type: string
        enum:
          - "true"
      description: Removes the agent even when deployed agents depend on it.
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
    agentRequiredQ:
      name: agent
      in: query
      required: true
      schema:
        type: string
      description: The agent that owns the account.
    nameRequiredQ:
      name: name
      in: query
      required: true
      schema:
        type: string
      description: The account's name.
    askId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: A pending ask's id, as the auth list shows it.
    agentQ:
      name: agent
      in: query
      schema:
        type: string
      description: "One agent's id: keeps its rows, its calls or its history only."
    take:
      name: take
      in: query
      schema:
        type: string
        enum:
          - "true"
      description: "Removes an ended compile's progress as it is answered: the deploy's last read."
    call:
      name: call
      in: query
      schema:
        type: string
      description: "The call id the compile's start answered. With it, a compile no compiler has brought to its progress yet reads `waiting` for as long as that call still stands on the plane."
    tree:
      name: tree
      in: query
      schema:
        type: string
        enum:
          - "true"
      description: "Walks the calls this call caused as well, depth first in the order they began, each entered with its own call event before its records."
    after:
      name: after
      in: query
      schema:
        type: integer
        minimum: 0
      description: "The position a previous answer named as `next`: the count of the call's records answered before this page; zero when absent."
    view:
      name: view
      in: query
      schema:
        type: string
        enum:
          - conversation
          - live
      description: "Renders the records as the trace view reads them, beside the records: `conversation` renders the call as the conversation of the agent that ran it, as it comes; `live` renders each record as an agent's live stream shows it."
    streamView:
      name: view
      in: query
      schema:
        type: string
        enum:
          - live
      description: "Renders each record as the trace view reads one record of an agent's live stream: every data event becomes a LiveRecord, the record with its lines."
    details:
      name: details
      in: query
      schema:
        type: string
        enum:
          - "true"
      description: "With `view`: expands the view's details (contexts, reasoning, whole values)."
    debug:
      name: debug
      in: query
      schema:
        type: string
        enum:
          - "true"
      description: "With `view`: includes the agent's own debug lines."
    zone:
      name: zone
      in: query
      schema:
        type: string
      description: "With `view`: the IANA time zone the view's clocks and stamps read in (`Asia/Tokyo`); utc when absent."
    backlog:
      name: backlog
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 1000
      description: "How many recent records to deliver first (0 without one, capped at 1000)."
    since:
      name: since
      in: query
      schema:
        type: string
        format: date-time
      description: "The moment the stream's reads start from: records at or after it, until one is seen (a deploy passes its own start, so the agent's earlier history is never read)."
    state:
      name: state
      in: query
      required: true
      schema:
        type: string
    code:
      name: code
      in: query
      schema:
        type: string
    error:
      name: error
      in: query
      schema:
        type: string
    errorDescription:
      name: error_description
      in: query
      schema:
        type: string
  responses:
    BadRequest:
      description: A terminal or contract-violation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 'No admitted bearer: exactly `unauthorized: the API needs the bearer`, or `unauthorized: the operator token "<name>" was revoked`.'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Inconclusive:
      description: A judgment-inconclusive failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unexpected:
      description: A route that failed unexpectedly, the same shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: "A retryable or target-unavailable failure: the platform agent behind the operation did not answer (a controller restart, a substrate hiccup), the same shape; retry."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AgentCallRecord:
      type: object
      properties:
        kind:
          type: string
          const: agent-call
        target:
          type: string
        handler:
          type: string
        args: {}
        result: {}
        error:
          type: string
        stack:
          type: string
        linked:
          type: boolean
        mocked:
          type: boolean
          description: A test run's mock answered the call in place of the target's deployment.
        durationMs:
          type: number
        agentId:
          type: string
        callId:
          type: string
        attemptId:
          type: string
          description: The attempt of the call the record belongs to, when the record is the attempt's own.
        run:
          type: string
          description: "The run that made the record, `<grant>.<count>`: runs order by their grant, then their count, as numbers."
        place:
          type: number
          description: "The record's place in its run: inside one run the records order by it."
        seq:
          type: number
        at:
          type: string
      required:
        - kind
        - target
        - handler
        - durationMs
        - agentId
        - callId
        - seq
        - at
    AgentDeleteConflict:
      description: "Deployed agents depend on the one being removed: nothing was removed, and the dependents are named beside the error."
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorEnvelope"
        dependents:
          type: array
          items:
            type: string
      required:
        - error
        - dependents
    AgentDeleteResult:
      description: What an agent removal did.
      type: object
      properties:
        removed:
          type: string
          description: The agent that was removed, when one was.
        fleet:
          type: number
          description: How many rows the fleet still carries.
        dependents:
          type: array
          items:
            type: string
          description: The rows whose uses name the agent.
      required:
        - dependents
    AgentRow:
      description: One fleet row as shipped.
      allOf:
        - $ref: "#/components/schemas/FleetAgentRowWire"
    AgentsResult:
      description: "The fleet's agents, generations and judgments."
      type: object
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentRow"
          description: One row per fleet row, as shipped.
        generations:
          type: array
          items:
            $ref: "#/components/schemas/GenerationRow"
          description: One row per generation.
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
          description: The document's judgments.
      required:
        - agents
        - generations
        - conditions
    AgentStartResult:
      description: "An agent program's start."
      type: object
      properties:
        agentId:
          type: string
          description: The agent whose program starts.
        run:
          type: number
          description: "Which run of the program this start asks for: one more than the run before it."
        callId:
          type: string
          description: "Absent: the call is a new version's own, and its id exists once that version's process has booted."
      required:
        - agentId
    UpgradeRequest:
      description: "The release the plane's hosts upgrade to."
      type: object
      properties:
        version:
          type: string
          description: "A release name: letters, digits, dots, dashes and underscores, a letter or digit first."
      required:
        - version
    UpgradeResult:
      description: "The release pointer as written."
      type: object
      properties:
        version:
          type: string
      required:
        - version
    DrainHostResult:
      description: "The host told to drain."
      type: object
      properties:
        host:
          type: string
      required:
        - host
    BeginRecord:
      type: object
      properties:
        kind:
          type: string
          const: begin
        of:
          type: string
          enum:
            - handler
            - step
            - call
        handler:
          type: string
        target:
          type: string
        linked:
          type: boolean
        label:
          type: string
        input: {}
        args: {}
        parentCallId:
          type: string
        callerAgentId:
          type: string
        agentId:
          type: string
        callId:
          type: string
        attemptId:
          type: string
          description: The attempt of the call the record belongs to, when the record is the attempt's own.
        run:
          type: string
          description: "The run that made the record, `<grant>.<count>`: runs order by their grant, then their count, as numbers."
        place:
          type: number
          description: "The record's place in its run: inside one run the records order by it."
        seq:
          type: number
        at:
          type: string
      required:
        - kind
        - of
        - agentId
        - callId
        - seq
        - at
    CompileAgentReport:
      description: One agent's compile evidence, on the wire.
      type: object
      properties:
        agentId:
          type: string
        status:
          type: string
          enum:
            - failed
            - compiled
            - current
            - skipped
        verification:
          type: string
          enum:
            - live
            - none
            - waiting
        waitingFor:
          type: array
          items:
            type: string
        contractChange:
          type: string
          enum:
            - none
            - compatible
            - breaking
        attempts:
          type: number
        triageCount:
          type: number
        liveCycles:
          type: number
        costUsd:
          type: number
        durationMs:
          type: number
        inputTokens:
          type: number
        outputTokens:
          type: number
        cacheKey:
          type: string
        code:
          type: string
          enum:
            - amended
            - fresh
            - regated
            - refreshed
            - planned
          description: "How the code came to be: amended, regated, refreshed, fresh, or planned for a plan-only compile."
        amendedFrom:
          type: string
          description: The digest of the previous compile this one descends from.
        detail:
          type: string
        artifact:
          type: string
          description: "The packed artifact's digest in the plane store, when the compile packed it: every shipped service, and every seeded agent, modules included."
        package:
          type: string
          description: "The .cern package of the agent in the plane store: the bytes the client writes back beside the spec."
      required:
        - agentId
        - status
        - attempts
        - triageCount
        - costUsd
    CompileIssue:
      description: One finding from the spec gates, on the wire.
      type: object
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
            - error
            - warning
        agentId:
          type: string
        message:
          type: string
        line:
          type: number
        hint:
          type: string
      required:
        - code
        - severity
        - agentId
        - message
    CompileProgressResponse:
      description: "A compile's narration and outcome, read off its document: running, or ended with its answer or its failure; or waiting, for a compile that was started and that no compiler has brought to its document yet."
      type: object
      properties:
        compileId:
          type: string
        callId:
          type: string
          description: "The compile's own call id: the id its trace is filed under, which a cancellation takes. For a waiting compile, the id the query named, which names no version yet."
        status:
          type: string
          enum:
            - waiting
            - running
            - done
            - failed
        steps:
          type: array
          items:
            $ref: "#/components/schemas/CompileStepRecord"
        answer:
          $ref: "#/components/schemas/PlaneCompileResponse"
        error:
          $ref: "#/components/schemas/ErrorEnvelope"
      required:
        - compileId
        - callId
        - status
        - steps
    CompileStep:
      description: The compile steps, in the order a watcher reads them.
      type: string
      enum:
        - plan
        - agent
        - prepare
        - change
        - write code
        - check code
        - write tests
        - check tests
        - store
        - deploy
        - verify
        - declare
        - triage
        - fix code
        - fix tests
        - retry
        - done
    CompileStepRecord:
      description: "One narrated step of a compile: what happened, to which agent, in which attempt."
      type: object
      properties:
        attemptId:
          type: string
        seq:
          type: number
        at:
          type: string
        subject:
          type: string
        step:
          $ref: "#/components/schemas/CompileStep"
        state:
          type: string
          enum:
            - begin
            - end
            - note
        detail:
          type: string
        ok:
          type: boolean
        durationMs:
          type: number
        attempt:
          type: number
        failures:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              message:
                type: string
            required:
              - name
              - message
        result:
          type: string
          enum:
            - compiled
            - current
            - failed
            - skipped
        verification:
          type: string
          enum:
            - live
            - none
            - waiting
        waitingFor:
          type: array
          items:
            type: string
        tests:
          type: string
          enum:
            - reused
            - updated
        package:
          type: string
