          type: string
          description: The agent that owns the account.
        name:
          type: string
          description: The account's name.
        provider:
          type: string
          description: The provider word.
        agentId:
          type: string
          description: The agent whose call is waiting (the compiler's, when it asks on the agent's behalf during a compile).
        callId:
          type: string
          description: The waiting call's id.
        instructions:
          type: string
          description: Numbered steps an operator who has never used the provider's console follows blind.
        fields:
          type: array
          items:
