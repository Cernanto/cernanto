packages:
  - system
  - runtime/*
  - format
  - cli
# A security floor: the gateway client's generator pins js-yaml 4.2.0
# exactly, below the patched release.
overrides:
  '@hey-api/json-schema-ref-parser>js-yaml': 4.3.2
publicHoistPattern:
  - '@types/*'
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@aws-sdk/checksums@3.1001.7'
  - '@aws-sdk/client-dynamodb@3.1159.0'
  - '@aws-sdk/client-s3@3.1159.0'
  - '@aws-sdk/core@3.978.7'
  - '@aws-sdk/credential-provider-env@3.972.78'
  - '@aws-sdk/credential-provider-http@3.972.80'
  - '@aws-sdk/credential-provider-ini@3.973.23'
  - '@aws-sdk/credential-provider-login@3.972.85'
  - '@aws-sdk/credential-provider-node@3.972.90'
  - '@aws-sdk/credential-provider-process@3.972.78'
  - '@aws-sdk/credential-provider-sso@3.973.22'
  - '@aws-sdk/credential-provider-web-identity@3.972.84'
  - '@aws-sdk/dynamodb-codec@3.973.52'
  - '@aws-sdk/lib-dynamodb@3.1159.0'
  - '@aws-sdk/middleware-endpoint-discovery@3.972.36'
  - '@aws-sdk/middleware-sdk-s3@3.972.83'
  - '@aws-sdk/nested-clients@3.997.52'
  - '@aws-sdk/signature-v4-multi-region@3.996.50'
  - '@aws-sdk/token-providers@3.1159.0'
  - '@aws-sdk/xml-builder@3.972.42'
# The release is packed for linux from this workspace's node_modules,
# so the native packages linux needs must be installed here even
# though the workspace itself is a Mac or a CI runner; the packer
# drops packages that declare a foreign os or cpu, so a release
# carries exactly the natives its servers can run.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  # The servers' Debian is glibc; a package that declares no libc
  # (pure js) is unaffected by this filter.
  libc:
    - glibc
